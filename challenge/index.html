<!doctype html><html lang="zh-Hant" data-qm-unit="0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牙寶歷險記｜站內複習挑戰</title><style>
:root{--ink:#294a61;--paper:#fffaf1;--line:#665247;--orange:#c9875d;--green:#7d9f88}*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(135deg,#e8f1f1,#f3efe4);color:#35454b;font:18px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif}main{max-width:820px;margin:auto;background:var(--paper);border:2px solid #d7d4ca;border-radius:22px;padding:clamp(20px,4vw,38px);min-height:88dvh}a{color:var(--ink)}h1,h2{color:var(--ink);line-height:1.3}h1{font-size:clamp(2rem,5vw,3rem);margin:10px 0}.tag{color:#a96443;font-weight:800;letter-spacing:.08em}.question{border:2px solid #d2d8d3;background:#fffef9;border-radius:16px;padding:17px;margin:18px 0}.question h2{font-size:1.25rem;margin:0 0 8px}.choice{display:block;width:100%;margin:8px 0;padding:12px 15px;border:2px solid #9caba8;border-radius:12px;background:#eaf2f0;color:#294a61;text-align:left;font:inherit;font-weight:700;cursor:pointer;min-height:50px}.choice:hover,.choice:focus-visible{outline:3px solid #426d88;outline-offset:2px}.choice.good{background:#e5f2e6;border-color:#568064}.choice.try{background:#fff0e5;border-color:#b97e5e}.feedback{min-height:28px;font-weight:700}.next{min-height:50px;background:var(--orange);color:white;border:2px solid #a96443;border-radius:12px;padding:10px 20px;font:inherit;font-weight:800;cursor:pointer}.next[hidden],.question[hidden],#result[hidden]{display:none}.summary{border-left:5px solid var(--green);padding:12px 17px;background:#eff5ef}.links{display:flex;flex-wrap:wrap;gap:15px;margin-top:20px}@media(max-width:500px){body{padding:8px}main{padding:16px 14px}}
</style><link rel="stylesheet" href="../tooth-theme.css"></head><body><main><a href="../">← 回三單元首頁</a><p class="tag">選做延伸｜站內複習</p><h1>牙寶的護牙挑戰</h1><p>六題，每單元兩題。選錯可以讀提示再試；不計時，也不需要登入。完成後可以和同伴說出一題的理由。</p><p id="count" role="status"></p><section class="question" id="question"><h2 id="prompt"></h2><div id="choices"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="next" id="next" type="button" hidden>下一題 →</button></section><section id="result" hidden><h2>複習完成</h2><p class="summary" id="result-text"></p><p>想一想：哪一題你需要再看一次？回到該單元，找一張圖或一段話當證據。</p><div class="links"><a href="../unit1/">第一單元</a><a href="../unit2/">第二單元</a><a href="../unit3/">第三單元</a></div><p><button class="next" id="again" type="button">再挑戰一次</button></p></section></main><script>
const qs=[
 {unit:1,q:'看牙時，牙科燈主要幫助牙醫做什麼？',options:['照亮口腔，方便觀察','讓牙齒自己變白'],answer:0,hint:'想想醫師要怎麼看清楚牙齒。',reason:'牙科燈照亮口腔，幫助牙醫看清楚牙齒。'},
 {unit:1,q:'看牙時覺得害怕，可以怎麼做？',options:['告訴牙醫或陪同的大人','一直忍耐，不讓人知道'],answer:0,hint:'哪一個做法能讓別人幫忙？',reason:'說出感受，牙醫和大人才能了解並協助你。'},
 {unit:2,q:'小朋友較早長出的一批牙齒叫什麼？',options:['乳齒','恆齒'],answer:0,hint:'回想兩位牙齒夥伴誰先出場。',reason:'乳齒較早長出，之後逐漸由恆齒接替。'},
 {unit:2,q:'牙冠最外層的保護構造是哪一層？',options:['琺瑯質','牙髓'],answer:0,hint:'找牙齒剖面圖最外面的部分。',reason:'琺瑯質覆蓋牙冠，是堅硬的外層。'},
 {unit:3,q:'同一杯甜飲，哪一種喝法會讓牙齒更常接觸糖？',options:['整個下午反覆小口喝','用餐時間喝完後改喝水'],answer:0,hint:'比較接觸糖的次數。',reason:'反覆啜飲會讓牙齒更多次接觸到糖。'},
 {unit:3,q:'喝完酸性果汁後，先做哪件事較合適？',options:['先喝水或用水漱口','立刻用力刷牙'],answer:0,hint:'回想第三單元清潔小隊的提醒。',reason:'可先喝水或用水漱口，之後維持平常刷牙習慣。'}
];let index=0,mistakes=new Set(),done=false;const $=id=>document.getElementById(id);
function render(){const q=qs[index];$('count').textContent=`第 ${index+1} / ${qs.length} 題・第 ${q.unit} 單元`;$('prompt').textContent=q.q;$('feedback').textContent='選一個答案。';$('next').hidden=true;done=false;$('choices').replaceChildren();q.options.forEach((option,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=option;b.addEventListener('click',()=>{if(done)return;if(i===q.answer){done=true;b.classList.add('good');$('feedback').textContent='答對了！'+q.reason;$('next').hidden=false}else{mistakes.add(index);b.classList.add('try');$('feedback').textContent='再想一想：'+q.hint}});$('choices').appendChild(b)})}
$('next').addEventListener('click',()=>{if(!done)return;if(index<qs.length-1){index++;render()}else{try{localStorage.setItem('tooth-adventure-last-review-v1',JSON.stringify({completed:Date.now(),revisit:[...mistakes]}))}catch(_){}$('question').hidden=true;$('result').hidden=false;$('count').textContent='6 / 6 題已完成';$('result-text').textContent=mistakes.size?`完成六題；有 ${mistakes.size} 題曾需要提示。回單元找線索後，可以再挑戰一次。`:'完成六題！你能說出每個答案背後的理由嗎？'}});
$('again').addEventListener('click',()=>{index=0;mistakes=new Set();$('question').hidden=false;$('result').hidden=true;render()});render();
</script><script src="../tooth-collection.js"></script><script src="../qm-support.js?v=4"></script></body></html>
